name: Delete Deployments
on: workflow_dispatch

permissions:
  contents: write
  deployments: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Snapshot every page before deletion, so removing records cannot shift pages.
          deployment_ids="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/deployments?per_page=100" --jq '.[].id')"
          while IFS= read -r id; do
            [[ -n "$id" ]] || continue
            echo "Deleting deployment ${id}..."
            gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" \
              -f state=inactive --silent
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/deployments/${id}" --silent
          done <<< "$deployment_ids"
