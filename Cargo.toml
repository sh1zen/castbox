[package]
name = "castbox"
version = "0.2.0"
authors = ["Andrea Frolli dev.sh1zen@outlook.it"]
edition = "2024"
description = "Thread-safe Rust smart pointers with runtime downcasting, shared ownership, and synchronized interior mutability."
license = "Apache-2.0"
repository = "https://github.com/sh1zen/castbox"
documentation = "https://docs.rs/castbox"
readme = "README.md"
keywords = ["smart-pointer", "downcast", "type-erasure", "thread-safe", "reference-counted"]
categories = ["concurrency", "data-structures", "memory-management"]
exclude = [".gitignore", ".github/*"]

[dependencies]
crossync = "0.2.1"

[lib]
name = "castbox"
path = "src/lib.rs"


